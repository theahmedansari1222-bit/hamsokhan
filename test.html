<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site check</title>
<style>
body{margin:0;padding:16px;background:#fff;color:#111;font:16px/1.6 system-ui,sans-serif}
h1{font-size:22px;margin:0 0 12px}
.l{padding:6px 0;border-bottom:1px solid #ddd;word-break:break-all}
.ok{color:#0a7a2f}.no{color:#b3141a}.wt{color:#8a6100}
</style>
</head>
<body>
<h1>Site check</h1>
<div id="o"></div>
<script>
const o = document.getElementById("o");
const say = (t, c) => { const d = document.createElement("div"); d.className = "l " + c; d.textContent = t; o.append(d); };
const base = location.href.replace(/[^\/]*$/, "");
say("This page loaded (HTML works)", "ok");
say("Address: " + base, "wt");
say("Online: " + navigator.onLine, navigator.onLine ? "ok" : "no");

async function get(url, opt) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 12000), s = Date.now();
  try { const r = await fetch(url, { cache: "no-store", signal: ac.signal, ...opt }); return { r, ms: Date.now() - s }; }
  catch (e) { return { e: e.name === "AbortError" ? "timeout 12s" : e.message }; }
  finally { clearTimeout(t); }
}

(async () => {
  for (const f of ["index.html", "article.html", "style.css", "config.js", "app.js", "jameel.woff"]) {
    const x = await get(base + f);
    if (x.e) { say(f + " : FAILED (" + x.e + ")", "no"); continue; }
    if (!x.r.ok) { say(f + " : NOT FOUND (" + x.r.status + ")", "no"); continue; }
    let extra = "";
    if (f === "jameel.woff") extra = " size=" + ((await x.r.arrayBuffer()).byteLength / 1048576).toFixed(1) + " MB";
    else {
      const t = await x.r.text(); extra = " size=" + t.length + " chars";
      if (f === "index.html") extra += t.includes("jsdelivr") ? " | OLD VERSION (still has jsdelivr)" : t.includes('id="feed"') ? " | new version" : " | NOT the khamaokhayal index (different file)";
      if (f === "app.js") extra += t.includes("Minimal Supabase client") ? " | new version" : " | OLD VERSION";
    }
    say(f + " : OK" + extra + " (" + x.ms + " ms)", "ok");
  }
  const u = "https://mqhhpedpkddpifatmgtc.supabase.co/rest/v1/settings?select=value&limit=1";
  const k = "sb_publishable_L-KEAEVrx7-cEtP1xryU_w_Yt8qNcza";
  const x = await get(u, { headers: { apikey: k } });
  if (x.e) say("Supabase : FAILED (" + x.e + ")", "no");
  else say("Supabase : HTTP " + x.r.status + " (" + x.ms + " ms) " + (x.r.ok ? "" : (await x.r.text()).slice(0, 160)), x.r.ok ? "ok" : "no");
  const j = await get("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js", { method: "HEAD" });
  say("jsdelivr CDN : " + (j.e ? "FAILED (" + j.e + ")" : "HTTP " + j.r.status + " (" + j.ms + " ms)"), j.e ? "no" : "ok");
  say("Done. Send a screenshot of this page.", "wt");
})();
</script>
</body>
</html>
