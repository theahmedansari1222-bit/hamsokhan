name: build-post-pages
on:
  schedule:
    - cron: "10 * * * *"   # every hour
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
concurrency:
  group: build-post-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate post pages and sitemap
        run: node build-posts.mjs
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update post pages and sitemap"
            git pull --rebase -q
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
