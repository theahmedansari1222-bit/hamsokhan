<body>
<div class="wrap">
  <header></header>
  <main id="m"><p class="mut">لوڈ ہو رہا ہے…</p></main>
  <footer id="foot"></footer>
</div>
<script>
(async () => {
  const L = layout("writers");
  const [{ data: as }, { data: ps }] = await Promise.all([
    sb.from("authors").select("id,name,bio,photo_url").order("name"),
    sb.from("posts").select("author_id").eq("status", "published")
  ]);
  const n = {}; (ps || []).forEach(p => n[p.author_id] = (n[p.author_id] || 0) + 1);
  const list = (as || []).filter(a => n[a.id]);
  $("#m").innerHTML = `<h1 class="ttl">لکھاری</h1>` + (list.map(a =>
    `<a class="wl" href="writer.html?id=${a.id}">${av(a)}<span style="flex:1">${esc(a.name)}</span><span class="mut" style="font-size:15px">${ud(n[a.id])} تحریریں</span></a>`
  ).join("") || '<p class="mut">ابھی کوئی لکھاری نہیں۔</p>');
  await L; document.title = "لکھاری — " + document.title;
})();
</script>
</body>
</html>
